    .sx-anim .step{opacity:0;transform:translateY(16px)}

    .sx-anim.go .step:nth-child(4){transition-delay:.45s,.45s,0s,0s}
    .sx-anim .sx-flow{transform:scaleX(0)}

    .sx-anim.go .step:nth-child(1) .sx-flow{transition-delay:.5s}
    .sx-anim.go .step:nth-child(2) .sx-flow{transition-delay:1.2s}

    .sx-anim .ic1 .ln{stroke-dashoffset:20}
    .sx-anim.go .ic1 .ln{stroke-dashoffset:0;transition:stroke-dashoffset .6s ease .7s}
    .sx-anim .ic1 .kid{transform:scale(0);transform-box:fill-box;transform-origin:center}
    .sx-anim.go .ic1 .kid{transform:scale(1);transition:transform .45s cubic-bezier(.3,1.6,.5,1) var(--d)}
    .sx-anim .ic3 .ck{stroke-dashoffset:30}
    .sx-anim.go .ic3 .ck{stroke-dashoffset:0;transition:stroke-dashoffset .6s ease 1.6s}
    .sx-anim .ic4 .ck{stroke-dashoffset:30}
    .sx-anim.go .ic4 .ck{stroke-dashoffset:0;transition:stroke-dashoffset .6s ease 2.1s}
    .sx-anim .ic4 .knob{transform:none}
    .sx-anim .ic4 .track{fill-opacity:.15}
    .sx-anim.go .ic4 .knob{transform:translateX(12px);transition-delay:2.6s}
    .sx-anim.go .ic4 .track{fill-opacity:.9;transition:fill-opacity .4s ease 2.6s}
    @media (prefers-reduced-motion:reduce){.ic2 .dot,.ic3 .scan{animation:none}.pipe.fx .step:hover{transform:none}}
    @media print{.sx-anim .step{opacity:1;transform:none}.sx-anim .sx-flow{transform:scaleX(1)}.sx-anim .ic1 .ln,.sx-anim .ic3 .ck,.sx-anim .ic4 .ck{stroke-dashoffset:0}.sx-anim .ic1 .kid{transform:none}.sx-anim .ic4 .knob{transform:translateX(12px)}.sx-anim .ic4 .track{fill-opacity:.9}.ic2 .dot,.ic3 .scan{animation:none}.sx-ic{width:56px;height:42px;margin-bottom:6px}.sx-ic svg{width:46px;height:34px}}
    </style>
