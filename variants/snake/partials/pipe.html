    <script>
    (function(){
      var pipe=document.getElementById('pipeFx'); if(!pipe) return;
      var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
      var cl=function(x){return x<0?0:x>1?1:x}, ease=function(p){return 1-Math.pow(1-p,3)};
      function scene(svg){
        var T=+svg.getAttribute('data-loop'), els=[].map.call(svg.querySelectorAll('[data-a]'),function(el){
          var o={el:el,a:el.getAttribute('data-a'),t:+el.getAttribute('data-t')||0,d:+(el.getAttribute('data-d')||.5),out:el.getAttribute('data-out')};
          if(o.a==='draw'){el.setAttribute('pathLength','1');el.style.strokeDasharray='1'}
          if(o.a==='count'){o.from=+el.getAttribute('data-from');o.to=+el.getAttribute('data-to')}
          if(o.a==='kf'){o.prop=el.getAttribute('data-prop');o.kf=el.getAttribute('data-kf').split(',').map(function(s){s=s.split(':');return[+s[0],+s[1]]})}
          return o});
        function kfv(k,t){if(t<=k[0][0])return k[0][1];for(var i=1;i<k.length;i++)if(t<=k[i][0]){var a=k[i-1],b=k[i];return a[1]+(b[1]-a[1])*ease((t-a[0])/(b[0]-a[0]))}return k[k.length-1][1]}
        function render(t){
          var g=t>T-.6?cl((T-t)/.6):1;
          els.forEach(function(o){
            var p=ease(cl((t-o.t)/o.d)), op=g, s=o.el.style;
            if(o.out&&t>+o.out)op*=1-cl((t-o.out)/.3);
            switch(o.a){
              case 'fade':s.opacity=p*op;break;
              case 'pop':s.opacity=p*op;s.transform='scale('+(.6+.4*p)+')';break;
              case 'draw':s.strokeDashoffset=1-p;s.opacity=op;break;
              case 'grow':s.transform='scaleX('+p+')';s.opacity=op;break;
              case 'count':o.el.textContent=Math.round(o.from+(o.to-o.from)*p);break;
              case 'kf':var v=kfv(o.kf,t),vis=t>=o.t?op:0;
                if(o.prop==='w'){s.transform='scaleX('+v+')';s.opacity=vis}else{o.el.textContent=Math.round(v*100)+'%';s.opacity=vis}
            }
          })}
        return{T:T,render:render}
      }
      window.__sxScene=scene;
      var scenes=[].map.call(pipe.querySelectorAll('.sx-stage svg'),scene);
      // 預設畫面＝每段動畫的完成狀態（沒 JS 也是完整畫面；列印另外整塊隱藏）
      scenes.forEach(function(s){s.render(s.T-.7)});
      if(reduce||!('IntersectionObserver' in window)||!window.requestAnimationFrame)return;
      pipe.classList.add('sx-anim');
      var running=false,start=0,raf=0;
      function tick(now){if(!running)return;var e=(now-start)/1000;scenes.forEach(function(s){s.render(e%s.T)});raf=requestAnimationFrame(tick)}
      new IntersectionObserver(function(es){es.forEach(function(e){
        if(e.isIntersecting){pipe.classList.add('go');if(!running){running=true;start=performance.now();raf=requestAnimationFrame(tick)}}
        else if(running){running=false;cancelAnimationFrame(raf)}
      })},{threshold:.15}).observe(pipe);
    })();
    </script>
